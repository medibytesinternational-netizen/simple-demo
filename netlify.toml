# Netlify configuration for the MediBytes HMS React frontend (frontend/).
# The FastAPI backend is NOT deployed by Netlify; see the /api/* rule below.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Frontend-only UI preview: answers from bundled synthetic data and sends no
  # backend requests. Remove (or set to "false") once a real backend is connected.
  VITE_DEMO_MODE = "true"

# --- API --------------------------------------------------------------------
# The app calls relative /api/... URLs. The Vite dev proxy (vite.config.ts) only
# exists in local development; on Netlify those requests must be handled here.
#
# Until a public FastAPI URL exists, /api/* returns an explicit JSON 404 so the
# UI shows "backend not configured" instead of parsing index.html as data.
#
# When the backend is public, replace this rule with a proxy (same-origin, so the
# backend's localhost-only CORS list does not need to change):
#
#   [[redirects]]
#     from = "/api/*"
#     to = "https://YOUR-BACKEND-HOST/api/:splat"
#     status = 200
#     force = true
[[redirects]]
  from = "/api/*"
  to = "/api-not-configured.json"
  status = 404
  force = true

# --- SPA fallback -------------------------------------------------------------
# React Router owns every other path (/dashboard, /patients, /notes?tab=…).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
