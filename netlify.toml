# Netlify configuration for the frontend-only MediBytes demos (frontend/).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # The Simple Demo UI runs against bundled synthetic data by default.
  VITE_DEMO_MODE = "true"

# The Product-main page is frontend-only; keep its missing API response explicit.
[[redirects]]
  from = "/api/*"
  to = "/api-not-configured.json"
  status = 404
  force = true

[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 200

# --- SPA fallback -------------------------------------------------------------
# React Router owns every other path (/dashboard, /patients, /notes?tab=…).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
