[project]
name = "medibytes"
version = "1.0.0"
description = "Doctor's dictation to a 6-section discharge note: MedASR -> small-int8 second pass -> fuzzy matcher -> gpt-4.1"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # starlette's TestClient announces a future httpx2 switch; not our code
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long regexes and prompt strings read better unwrapped
    "E731",   # small lambdas as callbacks
    "B023",   # loop-bound lambdas are consumed immediately
    "UP031",  # %-formatting kept verbatim in ported regex builders
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Large ML/runtime packages: type our calls into them, not their internals.
module = ["torch.*", "transformers.*", "faster_whisper.*", "huggingface_hub.*", "imageio_ffmpeg.*", "soundfile.*"]
follow_imports = "skip"
